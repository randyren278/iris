name: Iris CI

on:
  pull_request:
  push:
    branches:
      - master
      - agentic-hardening

permissions:
  contents: read

jobs:
  deterministic:
    name: Deterministic contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run complete deterministic suite
        run: python -m pytest -q

      - name: Audit production wiring
        run: python scripts/checks/wiring_audit.py

      - name: Audit documentation claims against unwired modules
        run: >-
          python scripts/checks/wiring_audit.py --check-docs
          README.md docs/ARCHITECTURE.md docs/OPERATIONS.md

      - name: Lint architecture diagrams
        run: python scripts/checks/mermaid_lint.py --min 4 docs/ARCHITECTURE.md

      - name: Check documentation links
        run: >-
          python scripts/checks/link_check.py
          README.md docs/ARCHITECTURE.md docs/OPERATIONS.md docs/slack-setup.md
