name: Iris CI

on:
  pull_request:
  push:
    branches:
      - master
      - agentic-hardening

permissions:
  contents: read

concurrency:
  group: iris-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run complete deterministic suite with branch coverage
        run: coverage run -m pytest -q

      - name: Enforce production coverage floor
        run: |
          coverage report -m
          coverage json -o coverage.json

      - name: Enforce per-module floor for production-critical modules
        run: python scripts/checks/coverage_gate.py --coverage-json coverage.json --floor 95.0

      - name: Audit production wiring
        run: python scripts/checks/wiring_audit.py

      - name: Audit documentation claims against unwired modules
        run: >-
          python scripts/checks/wiring_audit.py --check-docs
          README.md docs/ARCHITECTURE.md docs/OPERATIONS.md

      - name: Lint architecture diagrams
        run: python scripts/checks/mermaid_lint.py --min 4 docs/ARCHITECTURE.md

      - name: Check documentation links
        run: >-
          python scripts/checks/link_check.py
          README.md docs/ARCHITECTURE.md docs/OPERATIONS.md docs/slack-setup.md

  mutation:
    name: Safety mutation guard
    needs: deterministic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Deliberately break safety invariants and require the suite to catch each mutation
        run: >-
          python scripts/checks/mutation_guard.py
          --manifest scripts/checks/mutations.yaml --assert-min 24
