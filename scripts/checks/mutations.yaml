# Mutation manifest for scripts/checks/mutation_guard.py
# Each entry breaks one authority/safety invariant by replacing an exact,
# uniquely-matching source substring. The guard applies find->replace, runs
# pytest, requires red, then restores the file.
mutations:
- id: "hook-fails-open"
  file: "iris/approval_hook.py"
  invariant: "Claude tool calls deny on every hook failure path."
  find: "    except (OSError, ValueError, json.JSONDecodeError, KeyError, TypeError, AttributeError):\n        approved = False"
  replace: "    except (OSError, ValueError, json.JSONDecodeError, KeyError, TypeError, AttributeError):\n        approved = True"
- id: "client-fails-open"
  file: "iris/approvals.py"
  invariant: "An unreachable or malformed approval service always denies."
  find: "    except (OSError, ValueError, json.JSONDecodeError, AttributeError):\n        return False"
  replace: "    except (OSError, ValueError, json.JSONDecodeError, AttributeError):\n        return True"
- id: "timeout-approves"
  file: "iris/approvals.py"
  invariant: "Approval timeout is a denial even when timeout notification itself fails."
  find: "        if timed_out:\n            try:\n                notify(f\"Approval {request.id} timed out; denied.\")\n            except Exception:\n                pass\n            return False"
  replace: "        if timed_out:\n            try:\n                notify(f\"Approval {request.id} timed out; denied.\")\n            except Exception:\n                pass\n            return True"
- id: "server-fails-open"
  file: "iris/approvals.py"
  invariant: "Malformed approval socket payloads deny."
  find: "            except (OSError, ValueError, json.JSONDecodeError, KeyError, TypeError):\n                approved = False"
  replace: "            except (OSError, ValueError, json.JSONDecodeError, KeyError, TypeError):\n                approved = True"
- id: "approval-origin-ignored"
  file: "iris/approvals.py"
  invariant: "An approval decision can resolve only from the Slack channel/thread that received the request."
  find: "            if request.origin is not None and request.origin != origin:\n                return False"
  replace: "            if False and request.origin is not None and request.origin != origin:\n                return False"
- id: "conversation-gets-tools"
  file: "iris/conversation.py"
  invariant: "The retained text-only conversation backend has no tools."
  find: "                 \"--tools\", \"\", *CLAUDE_ISOLATION, \"-p\", \"--output-format\", \"json\", prompt],"
  replace: "                 *CLAUDE_ISOLATION, \"-p\", \"--output-format\", \"json\", prompt],"
- id: "isolation-dropped"
  file: "iris/conversation.py"
  invariant: "Every nested Claude command suppresses operator settings/hooks."
  find: "CLAUDE_ISOLATION = [\"--setting-sources\", \"\", \"--strict-mcp-config\", \"--disable-slash-commands\"]"
  replace: "CLAUDE_ISOLATION = []"
- id: "untrusted-context-admitted"
  file: "iris/conversation.py"
  invariant: "Only trusted self/team memory enters privileged conversational context."
  find: "        context = tuple(item for item in supplied if item.trust in {\"self\", \"team\"})"
  replace: "        context = tuple(item for item in supplied)"
- id: "codex-sandbox-widened"
  file: "iris/launcher.py"
  invariant: "Codex remains workspace-write sandbox bounded."
  find: "CODEX_SANDBOX = \"workspace-write\""
  replace: "CODEX_SANDBOX = \"danger-full-access\""
- id: "claude-permission-bypassed"
  file: "iris/launcher.py"
  invariant: "A gated Claude session keeps manual permission mode; autonomy is opt-in."
  find: "            mode = \"bypassPermissions\" if self._autonomous else \"manual\""
  replace: "            mode = \"bypassPermissions\""
- id: "claude-approval-hook-dropped"
  file: "iris/launcher.py"
  invariant: "A gated Claude session still installs the Iris PreToolUse approval hook."
  find: "            if self._approval_socket and not self._autonomous:"
  replace: "            if self._approval_socket and self._autonomous:"
- id: "secrets-from-env"
  file: "iris/slack_config.py"
  invariant: "Slack secrets come exclusively from the macOS login Keychain."
  find: "    result = runner(\n        [\"security\", \"find-generic-password\", \"-s\", KEYCHAIN_SERVICE,\n         \"-a\", account, \"-w\"],\n        check=False,\n        capture_output=True,\n        text=True,\n    )"
  replace: "    import os as _os\n    result = type(\"R\", (), {\"returncode\": 0, \"stdout\": _os.environ.get(account, \"\")})()"
- id: "prose-bypasses-action-gate"
  file: "iris/grammar.py"
  invariant: "Plain prose may request consequential work only through the agent action gate, never by being reclassified as an explicit coding command."
  find: "    if not separator or name.casefold() not in _TEXT or not remainder:\n        return None\n    return TextCommand(name.casefold(), remainder)"
  replace: "    if not separator or name.casefold() not in _TEXT or not remainder:\n        return TextCommand(\"claude\", normalized)\n    return TextCommand(name.casefold(), remainder)"
- id: "memory-admits-untrusted"
  file: "iris/memory.py"
  invariant: "Only operator-confirmed self/team claims become trusted memory."
  find: "        if trust not in {\"self\", \"team\"} or authoring_mode != \"operator_confirmed\":"
  replace: "        if False and (trust not in {\"self\", \"team\"} or authoring_mode != \"operator_confirmed\"):"
- id: "agent-action-approval-inverted"
  file: "iris/agent_actions.py"
  invariant: "General-agent coding actions launch only after a positive exact operator approval."
  find: "        if not self.approvals.request(\n            summary, timeout=self.timeout, notifier=notifier, origin=origin,\n        ):\n            raise AgentActionError(\"operator denied the action\")"
  replace: "        if self.approvals.request(\n            summary, timeout=self.timeout, notifier=notifier, origin=origin,\n        ):\n            raise AgentActionError(\"operator denied the action\")"
- id: "persistent-disarm-ignored"
  file: "iris/sessions.py"
  invariant: "Emergency stop remains disarmed across daemon/controller restart until terminal re-arm."
  find: "        self.disarmed = bool(self._disarm_path and self._disarm_path.exists())"
  replace: "        self.disarmed = False"
- id: slack-allowlist-open
  file: iris/slack.py
  invariant: Accept only allowlisted Slack user IDs in direct messages.
  find: '        if message.user_id not in self.allowed_user_ids:'
  replace: '        if False:'
- id: slack-allowlist-substring
  file: iris/slack.py
  invariant: Slack allowlist matching is exact, never substring/prefix.
  find: '        if message.user_id not in self.allowed_user_ids:'
  replace: '        if not any(message.user_id in item or item in message.user_id for item in self.allowed_user_ids):'
- id: slack-accepts-non-dm
  file: iris/slack.py
  invariant: Only direct messages drive Iris; channel and bot events are ignored.
  find: '        if message.channel_type != "im" or message.bot_id or message.subtype:'
  replace: '        if message.bot_id or message.subtype:'
- id: agent-turn-gets-builtin-tools
  file: iris/agent_conversation.py
  invariant: A conversational turn's nested Claude process carries no built-in tools.
  find: '                "--tools", "", *CLAUDE_ISOLATION,'
  replace: '                *CLAUDE_ISOLATION,'
- id: malformed-tool-request-dispatched
  file: iris/agent_conversation.py
  invariant: A tool request that fails protocol validation is answered as text, never dispatched.
  find: "    try:\n        return ToolRequest.from_json(candidate)\n    except ProtocolError:\n        return None"
  replace: "    try:\n        return ToolRequest.from_json(candidate)\n    except ProtocolError:\n        return ToolRequest(\"mutant\", \"workspace\", {\"path\": \".\"})"
- id: coordinator-drops-turn-tools
  file: iris/agent_conversation.py
  invariant: Each turn supplies its own origin-bound tool handlers to the runtime.
  find: '            reply = self._runtime.reply(agent, message.text, handlers=agent.handlers())'
  replace: '            reply = self._runtime.reply(agent, message.text)'
- id: runtime-ignores-turn-tools
  file: iris/agent_runtime.py
  invariant: Iris's runtime dispatches the turn's tools rather than only startup-registered ones.
  find: '        available = {**self._handlers, **(handlers or {})}'
  replace: '        available = dict(self._handlers)'
- id: socket-disconnect-not-reported
  file: iris/slack.py
  invariant: A dropped Socket Mode connection is recorded, so reported health is the socket's and not the process's.
  find: "                connected, down_since = False, self._clock()\n                LOG.warning(\"Socket Mode disconnected\")\n                if on_disconnected:\n                    on_disconnected()"
  replace: "                connected, down_since = False, self._clock()\n                LOG.warning(\"Socket Mode disconnected\")"
- id: socket-stall-never-restarts
  file: iris/slack.py
  invariant: A Socket Mode connection that stays down past the stall timeout ends the process so launchd restarts it.
  find: '            elif self._clock() - down_since >= self.stall_timeout:'
  replace: '            elif False:'
