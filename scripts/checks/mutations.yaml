# Mutation manifest for scripts/checks/mutation_guard.py
# Each entry breaks one CLAUDE.md invariant in iris/ by replacing an
# exact, uniquely-matching source substring. The guard applies find->replace,
# runs pytest, asserts it goes red, then restores the file.
mutations:
- id: "allowlist-open"
  file: "iris/allowlist.py"
  invariant: "Accept only allowlisted Slack user IDs in direct messages."
  find: "        if not isinstance(handle, str):\n            return False\n        return handle in self._handles"
  replace: "        return True"
- id: "allowlist-substring"
  file: "iris/allowlist.py"
  invariant: "Accept only allowlisted Slack user IDs; exact match only, no substring/prefix."
  find: "        return handle in self._handles"
  replace: "        return any(handle in item or item in handle for item in self._handles)"
- id: "gateway-skips-allowlist"
  file: "iris/main.py"
  invariant: "Accept only allowlisted Slack user IDs in direct messages."
  find: "        if not message.is_self_chat and not self.allowlist.allows(message.handle):\n            # Do not include a stranger's body in this early operational log.\n            LOG.warning(\"ignored message from non-allowlisted handle\")\n            return False\n        sent = self.config.sender(message.chat_guid, message.body)"
  replace: "        sent = self.config.sender(message.chat_guid, message.body)"
- id: "hook-fails-open"
  file: "iris/approval_hook.py"
  invariant: "Tool calls require an operator approval and deny by default on every failure path."
  find: "    except (OSError, ValueError, json.JSONDecodeError, KeyError, TypeError, AttributeError):\n        approved = False"
  replace: "    except (OSError, ValueError, json.JSONDecodeError, KeyError, TypeError, AttributeError):\n        approved = True"
- id: "client-fails-open"
  file: "iris/approvals.py"
  invariant: "Tool calls require an operator approval and deny by default on every failure path."
  find: "    except (OSError, ValueError, json.JSONDecodeError, AttributeError):\n        return False"
  replace: "    except (OSError, ValueError, json.JSONDecodeError, AttributeError):\n        return True"
- id: "timeout-approves"
  file: "iris/approvals.py"
  invariant: "Tool calls require an operator approval and deny by default on every failure path."
  find: "        if timed_out:\n            notify(f\"Approval {request.id} timed out; denied.\")\n            return False"
  replace: "        if timed_out:\n            notify(f\"Approval {request.id} timed out; denied.\")\n            return True"
- id: "server-fails-open"
  file: "iris/approvals.py"
  invariant: "Tool calls require an operator approval and deny by default on every failure path."
  find: "            except (OSError, ValueError, json.JSONDecodeError, KeyError, TypeError):\n                approved = False"
  replace: "            except (OSError, ValueError, json.JSONDecodeError, KeyError, TypeError):\n                approved = True"
- id: "conversation-gets-tools"
  file: "iris/conversation.py"
  invariant: "A conversational turn has no tools. It can explain or propose, but cannot perform an action."
  find: "                 \"--tools\", \"\", *CLAUDE_ISOLATION, \"-p\", \"--output-format\", \"json\", prompt],"
  replace: "                 *CLAUDE_ISOLATION, \"-p\", \"--output-format\", \"json\", prompt],"
- id: "isolation-dropped"
  file: "iris/conversation.py"
  invariant: "A conversational turn has no tools; a nested claude must not inherit operator settings/hooks."
  find: "CLAUDE_ISOLATION = [\"--setting-sources\", \"\", \"--strict-mcp-config\"]"
  replace: "CLAUDE_ISOLATION = []"
- id: "untrusted-context-admitted"
  file: "iris/conversation.py"
  invariant: "Only trusted, operator-confirmed memory is eligible for privileged context. Raw provider content remains untrusted and quarantined."
  find: "        context = tuple(item for item in supplied if item.trust in {\"self\", \"team\"})"
  replace: "        context = tuple(item for item in supplied)"
- id: "codex-sandbox-widened"
  file: "iris/launcher.py"
  invariant: "Tool calls require an operator approval and deny by default on every failure path."
  find: "CODEX_SANDBOX = \"workspace-write\""
  replace: "CODEX_SANDBOX = \"danger-full-access\""
- id: "claude-permission-bypassed"
  file: "iris/launcher.py"
  invariant: "Tool calls require an operator approval and deny by default on every failure path."
  find: "            base = [\"claude\", \"--model\", CODING_MODEL, \"--permission-mode\", \"manual\","
  replace: "            base = [\"claude\", \"--model\", CODING_MODEL, \"--permission-mode\", \"bypassPermissions\","
- id: "secrets-from-env"
  file: "iris/slack_config.py"
  invariant: "Obtain Slack secrets exclusively from the macOS login Keychain. Do not expose secret values in code, logs, prompts, shell history, commits, or replies."
  find: "    result = runner(\n        [\"security\", \"find-generic-password\", \"-s\", KEYCHAIN_SERVICE,\n         \"-a\", account, \"-w\"],\n        check=False,\n        capture_output=True,\n        text=True,\n    )"
  replace: "    import os as _os\n    result = type(\"R\", (), {\"returncode\": 0, \"stdout\": _os.environ.get(account, \"\")})()"
- id: "prose-becomes-action"
  file: "iris/grammar.py"
  invariant: "Explicit commands are the only route to coding orchestration."
  find: "    if not separator or name.casefold() not in _TEXT or not remainder:\n        return None\n    return TextCommand(name.casefold(), remainder)"
  replace: "    if not separator or name.casefold() not in _TEXT or not remainder:\n        return TextCommand(\"claude\", normalized)\n    return TextCommand(name.casefold(), remainder)"
- id: "memory-admits-untrusted"
  file: "iris/memory.py"
  invariant: "Only trusted, operator-confirmed memory is eligible for privileged context."
  find: "        if trust not in {\"self\", \"team\"} or authoring_mode != \"operator_confirmed\":"
  replace: "        if False and (trust not in {\"self\", \"team\"} or authoring_mode != \"operator_confirmed\"):"
- id: "poller-replays-history"
  file: "iris/poller.py"
  invariant: "A restart resumes rather than replaying; first-run high-water must not replay historical messages."
  find: "                self._save_high_water(self._current_max_rowid(conn))\n                return []"
  replace: "                self._save_high_water(0)\n                return []"
