[project]
name = "iris"
version = "0.1.0"
description = "Text-message gateway to local coding agents"
requires-python = ">=3.13"
dependencies = [
    "slack-sdk>=3.36,<4",
    "pyobjc-framework-EventKit>=12.2; platform_system == 'Darwin'",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyyaml>=6,<7", "coverage>=7,<8"]

[tool.setuptools.packages.find]
include = ["iris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["iris"]
omit = [
    "iris/*_probe.py",
    "iris/agent_probe_server.py",
    "iris/senses/calendar_probe.py",
]

[tool.coverage.report]
fail_under = 90
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
]
