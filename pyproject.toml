[project]
name = "iris"
version = "0.1.0"
description = "Text-message gateway to local coding agents"
requires-python = ">=3.13"
dependencies = [
    "slack-sdk>=3.36,<4",
    "pyobjc-framework-EventKit>=12.2; platform_system == 'Darwin'",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
include = ["iris*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
